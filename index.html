<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WERAL — Gestion de chantier</title>
<meta name="theme-color" content="#0a1628">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#0a1628;--bg2:#0f1e38;--surf:#152040;--surf2:#1c2d50;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --text:#f0f4ff;--text2:#8fa4cc;--text3:#4a6080;
  --green:#00d68f;--red:#ff4d6d;--amber:#ffb347;--blue:#4d9fff;
  --r:14px;--rs:10px;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
.light{
  --bg:#f0f3f8;--bg2:#e4e9f2;--surf:#fff;--surf2:#f0f3f8;
  --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.14);
  --text:#0a1628;--text2:#3a5070;--text3:#8fa4cc;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);min-height:100vh;overflow-x:hidden;font-family:var(--font);color:var(--text)}
body{max-width:480px;width:100%;margin:0 auto;padding-top:60px;padding-bottom:80px}
#topbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;
  background:rgba(10,22,40,.92);backdrop-filter:blur(20px);border-bottom:0.5px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;gap:10px}
.light #topbar{background:rgba(240,243,248,.96)}
.tb-logo{font-size:17px;font-weight:600;letter-spacing:.06em;color:var(--text)}
.tb-logo span{color:var(--green)}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tb-btn{width:32px;height:32px;border-radius:9px;border:0.5px solid var(--border2);background:var(--surf2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2)}
#navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;
  background:rgba(10,22,40,.95);backdrop-filter:blur(20px);border-top:0.5px solid var(--border);
  display:flex;padding:6px 0 10px}
.light #navbar{background:rgba(240,243,248,.97)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;
  cursor:pointer;padding:4px 0;color:var(--text3);font-size:9px;font-family:var(--font)}
.ni.active{color:var(--green)}
.ni svg{width:20px;height:20px}
.ni-add{width:44px;height:44px;border-radius:50%;background:var(--green);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-top:-16px;box-shadow:0 4px 20px rgba(0,214,143,.35)}
.ni-add svg{width:22px;height:22px;color:#000}
.page{display:none;padding:16px}
.page.active{display:block}
#loading{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px}
.spin{width:36px;height:36px;border:2.5px solid var(--surf2);border-top-color:var(--green);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#auth-screen{position:fixed;inset:0;background:var(--bg);z-index:998;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:24px}
.auth-logo{font-size:48px;font-weight:600;letter-spacing:.1em;color:var(--text);margin-bottom:4px}
.auth-logo span{color:var(--green)}
.auth-sub{font-size:13px;color:var(--text3);margin-bottom:40px;text-align:center;line-height:1.6}
.auth-card{background:var(--surf);border:0.5px solid var(--border2);border-radius:var(--r);
  padding:24px;width:100%;max-width:340px}
.auth-lbl{font-size:11px;color:var(--text3);margin-bottom:6px}
.phone-wrap{display:flex;align-items:center;background:var(--surf2);border:0.5px solid var(--border2);
  border-radius:var(--rs);padding:0 14px;margin-bottom:14px}
.phone-prefix{color:var(--text2);font-size:14px;padding-right:8px;border-right:0.5px solid var(--border2);margin-right:8px}
.phone-wrap input{background:transparent;border:none;outline:none;color:var(--text);font-size:15px;
  font-family:var(--font);flex:1;padding:13px 0;width:100%}
.btn-p{width:100%;padding:14px;border-radius:var(--rs);border:none;background:var(--green);
  color:#0a1628;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-o{padding:10px 16px;border-radius:var(--rs);border:0.5px solid var(--border2);background:transparent;
  color:var(--text2);font-family:var(--font);font-size:13px;cursor:pointer}
.card{background:var(--surf);border:0.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh h3{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.add-btn{font-size:11px;color:var(--green);background:transparent;border:none;cursor:pointer;font-family:var(--font)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.metric{background:var(--surf2);border-radius:10px;padding:12px}
.mlbl{font-size:10px;color:var(--text3);margin-bottom:4px}
.mval{font-size:17px;font-weight:500;font-family:var(--mono);color:var(--text)}
.mval.g{color:var(--green)}.mval.r{color:var(--red)}.mval.a{color:var(--amber)}
.cc{background:var(--surf);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer}
.cc-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.cc-name{font-size:14px;font-weight:500;color:var(--text)}
.cc-sub{font-size:11px;color:var(--text3);margin-top:2px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:500}
.bg{background:rgba(0,214,143,.15);color:var(--green)}
.ba{background:rgba(255,179,71,.15);color:var(--amber)}
.br{background:rgba(255,77,109,.15);color:var(--red)}
.bb{background:rgba(77,159,255,.15);color:var(--blue)}
.prog{height:4px;border-radius:2px;background:var(--surf2);overflow:hidden;margin-bottom:6px}
.prog-f{height:100%;border-radius:2px}
.cc-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}
.fi{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.fi:last-child{border-bottom:none}
.fi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fi-info{flex:1}.fi-title{font-size:13px;font-weight:500;color:var(--text)}
.fi-sub{font-size:10px;color:var(--text3);margin-top:2px}
.fi-amt{font-size:13px;font-weight:500;font-family:var(--mono)}
.fi-amt.out{color:var(--red)}.fi-amt.in{color:var(--green)}
.oi{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border)}
.oi:last-child{border-bottom:none}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.pb{width:28px;height:28px;border-radius:8px;border:0.5px solid var(--border2);background:var(--surf2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.pb.ok{background:rgba(0,214,143,.15);border-color:var(--green);color:var(--green)}
.pb.ko{background:rgba(255,77,109,.1);border-color:var(--red);color:var(--red)}
.si{padding:10px 0;border-bottom:0.5px solid var(--border)}
.si:last-child{border-bottom:none}
.si-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.fgrp{margin-bottom:12px}.flbl{font-size:11px;color:var(--text3);margin-bottom:5px}
.finp{width:100%;background:var(--surf2);border:0.5px solid var(--border2);border-radius:var(--rs);
  padding:12px 13px;font-size:14px;color:var(--text);font-family:var(--font);outline:none}
.finp:focus{border-color:var(--green)}
select.finp{appearance:none;cursor:pointer}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 13px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;
  color:var(--text2);font-size:12px;font-family:var(--font);cursor:pointer}
.chip.on{background:var(--green);color:#0a1628;border-color:var(--green);font-weight:500}
.fmsg{font-size:12px;color:var(--red);margin-bottom:8px;min-height:16px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surf);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-hd{font-size:15px;font-weight:600;color:var(--text);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.mclose{background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:22px;line-height:1}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surf2);
  border:0.5px solid var(--border2);border-radius:var(--rs);padding:10px 16px;font-size:13px;color:var(--text);
  z-index:300;opacity:0;transition:.25s;white-space:nowrap;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:14px}
.tab{padding:6px 14px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;
  color:var(--text2);font-size:12px;font-family:var(--font);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--green);color:#0a1628;border-color:var(--green);font-weight:500}
.phase-item{background:var(--surf2);border-radius:10px;padding:12px;margin-bottom:8px}
.phase-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.phase-slider{width:100%;height:4px;border-radius:2px;background:var(--border);appearance:none;outline:none;cursor:pointer;accent-color:var(--green)}
.pmi{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border)}
.pmi:last-child{border-bottom:none}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty svg{width:40px;height:40px;opacity:.3;margin:0 auto 12px;display:block}
.empty p{font-size:13px}
.divider{height:0.5px;background:var(--border);margin:10px 0}
.conf-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;font-family:var(--font)}
.conf-box{background:var(--surf);border-radius:var(--r);padding:22px;max-width:320px;width:100%;border:0.5px solid var(--border2)}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><div style="font-size:13px;color:var(--text3)">Chargement…</div></div>

<div id="auth-screen">
  <div class="auth-logo">WER<span>AL</span></div>
  <div class="auth-sub">Gestion de chantier BTP<br>Sénégal · Secteur informel & formel</div>
  <div class="auth-card">
    <div id="step-phone">
      <div class="auth-lbl">Numéro de téléphone</div>
      <div class="phone-wrap">
        <div class="phone-prefix">+221</div>
        <input type="tel" id="phone-inp" placeholder="77 000 00 00" inputmode="numeric" maxlength="9">
      </div>
      <div id="recaptcha-container" style="margin-bottom:12px"></div>
      <div class="fmsg" id="auth-msg"></div>
      <button class="btn-p" onclick="sendOTP()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.1 1.18 2 2 0 012.11 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.3 7.69a16 16 0 006 6l1.05-1.05a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        Recevoir le code SMS
      </button>
    </div>
    <div id="step-otp" style="display:none">
      <div class="auth-lbl">Code SMS reçu</div>
      <input class="finp" type="text" id="otp-inp" placeholder="_ _ _ _ _ _" inputmode="numeric" maxlength="6" style="text-align:center;font-size:22px;letter-spacing:10px;font-family:var(--mono);margin-bottom:12px">
      <div class="fmsg" id="otp-msg"></div>
      <button class="btn-p" id="verify-btn" onclick="verifyOTP()">Se connecter</button>
      <button style="width:100%;text-align:center;margin-top:10px;background:transparent;border:none;color:var(--text3);font-size:12px;cursor:pointer;font-family:var(--font)" onclick="resetAuth()">← Changer de numéro</button>
    </div>
  </div>
</div>

<div id="topbar" style="display:none">
  <div class="tb-logo">WER<span>AL</span></div>
  <div id="tb-chantier" style="font-size:11px;color:var(--text2);display:none;flex:1;margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
  <div class="tb-right">
    <button class="tb-btn" onclick="toggleTheme()" id="theme-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="tb-btn" onclick="doSignOut()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </div>
</div>

<div id="page-dash" class="page active" style="display:none"></div>
<div id="page-chantier" class="page" style="display:none"></div>
<div id="page-add" class="page" style="display:none"></div>
<div id="page-ouvriers" class="page" style="display:none"></div>
<div id="page-profil" class="page" style="display:none"></div>

<div id="navbar" style="display:none">
  <button class="ni on" id="ni-dash" onclick="goP('dash',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Chantiers
  </button>
  <button class="ni" id="ni-ouv" onclick="goP('ouvriers',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
    Ouvriers
  </button>
  <button class="ni-add" onclick="goP('add',null)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button class="ni" id="ni-pro" onclick="goP('profil',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Profil
  </button>
</div>
<div id="toast"></div>

<script>
// CONFIG — à remplacer par vos vraies clés Firebase
const FB={
  apiKey:"AIzaSyAvY2onqOWjsK4XKW_sF3rEaZB36Z9mMMk",
  authDomain:"weral-app.firebaseapp.com",
  projectId:"weral-app",
  storageBucket:"weral-app.firebasestorage.app",
  messagingSenderId:"291997041067",
  appId:"1:291997041067:web:be4ae345069b1d7a2fd2ee"
};
firebase.initializeApp(FB);
const auth=firebase.auth();
const db=firebase.firestore();
db.enablePersistence().catch(()=>{});

// STATE
let uid=null,userPhone='',userRole='operateur',userName='';
let chantiers=[],fournisseurs=[],prixMarche=[],ouvriersList=[];
let currentCid=null,confirmResult=null,rcv=null;
let unsub1=null,unsub2=null;
const AVC=['#1c3d6e','#0d4a3a','#4a1c3d','#3d3a0d','#1a3d5c'];
let ttt=null;

// ── AUTH ──────────────────────────────────
function initRCV(){
  if(rcv)return;
  rcv=new firebase.auth.RecaptchaVerifier('recaptcha-container',{size:'invisible',callback:()=>{}});
  rcv.render().catch(()=>{});
}

async function sendOTP(){
  const p=document.getElementById('phone-inp').value.replace(/\s/g,'');
  const msg=document.getElementById('auth-msg');
  if(p.length<8){msg.textContent='Numéro invalide';return;}
  msg.textContent='Envoi en cours…';
  try{
    initRCV();
    confirmResult=await auth.signInWithPhoneNumber('+221'+p,rcv);
    document.getElementById('step-phone').style.display='none';
    document.getElementById('step-otp').style.display='block';
    msg.textContent='';
    toast('Code envoyé au +221'+p);
  }catch(e){
    msg.textContent='Erreur: '+e.message;
    if(rcv){rcv.clear();rcv=null;}
  }
}

async function verifyOTP(){
  const code=document.getElementById('otp-inp').value.trim();
  const msg=document.getElementById('otp-msg');
  const btn=document.getElementById('verify-btn');
  if(code.length!==6){msg.textContent='Code à 6 chiffres';return;}
  btn.disabled=true;btn.innerHTML='<div class="spin" style="width:16px;height:16px;border-width:2px"></div> Vérification…';
  try{await confirmResult.confirm(code);}
  catch(e){msg.textContent='Code incorrect';btn.disabled=false;btn.innerHTML='Se connecter';}
}

function resetAuth(){
  document.getElementById('step-otp').style.display='none';
  document.getElementById('step-phone').style.display='block';
  document.getElementById('auth-msg').textContent='';
  confirmResult=null;if(rcv){rcv.clear();rcv=null;}
}

async function doSignOut(){
  if(!confirm('Se déconnecter ?'))return;
  if(unsub1)unsub1();if(unsub2)unsub2();
  await auth.signOut();
}

// ── INIT ──────────────────────────────────
auth.onAuthStateChanged(async user=>{
  document.getElementById('loading').style.display='none';
  if(!user){
    document.getElementById('auth-screen').style.display='flex';
    return;
  }
  uid=user.uid;userPhone=user.phoneNumber||'';
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('topbar').style.display='flex';
  document.getElementById('navbar').style.display='flex';
  document.querySelectorAll('.page').forEach(p=>p.style.display='block');
  await loadProfile();
  listenChantiers();
  listenFournisseurs();
  loadPrix();
  renderDash();
});

async function loadProfile(){
  try{
    const d=await db.collection('users').doc(uid).collection('data').doc('profile').get();
    if(d.exists()){const p=d.data();userRole=p.role||'operateur';userName=p.name||userPhone;}
    else showRoleModal();
  }catch(e){}
}

function showRoleModal(){
  const bg=mkModal(`
    <div class="modal-hd">Bienvenue sur WERAL</div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:16px">Quel est votre rôle ?</p>
    <div class="fgrp"><div class="flbl">Votre nom</div><input class="finp" id="rm-nom" placeholder="Prénom et nom"></div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
      <button class="btn-p" onclick="saveRole('operateur')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
        Opérateur — Chef de chantier / Conducteur
      </button>
      <button class="btn-o" style="width:100%;padding:14px" onclick="saveRole('patron')">

    <div class="metrics">

      <div class="metric"><div class="mlbl">Reliquats clients</div><div class="mval a">${fmt(reliquats)} F</div></div>

    <div style="display:flex;gap:8px;margin-bottom:14px">

async function loadStock(el,c){
  el.innerHTML=loading();
  try{
    const items=(await SP(currentCid).get()).docs.map(d=>({id:d.id,...d.data()}));
    el.innerHTML=`<div class="sh"><h3>Stock matériaux</h3><button class="add-btn" onclick="showAddStock('${c.id}')">+ Entrée</button></div>

async function loadPhases(el,c){
  el.innerHTML=loading();
  try{
    const phases=(await PP(currentCid).get()).docs.map(d=>({id:d.id,...d.data()}));
    const avg=phases.length?Math.round(phases.reduce((s,p)=>s+(p.pct||0),0)/phases.length):0;
    el.innerHTML=`<div class="sh"><h3>Phases chantier</h3><button class="add-btn" onclick="showAddPhase('${c.id}')">+ Phase</button></div>
      ${!phases.length?`<div class="empty"><p>Aucune phase définie</p></div>`:`
      <div class="card">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
          <span style="font-size:12px;color:var(--text2)">Avancement global</span>
          <span style="font-size:20px;font-weight:500;font-family:var(--mono);color:var(--green)">${avg}%</span>
        </div>
        <div class="prog" style="height:6px"><div class="prog-f" style="width:${avg}%;background:var(--green)"></div></div>
      </div>
      ${phases.map(p=>`<div class="phase-item">
        <div class="phase-hd">
          <span style="font-size:13px;font-weight:500;color:var(--text)">${p.nom}</span>

      </div>`).join('')}`}`;
  }catch(e){el.innerHTML=err();}
}

async function updPhase(cid,pid,val){
  await PP(cid).doc(pid).update({pct:parseInt(val)});
  const s=await PP(cid).get();
  const avg=s.docs.length?Math.round(s.docs.reduce((sum,d)=>sum+(d.data().pct||0),0)/s.docs.length):0;
  await CP(cid).update({avancement:avg});
  chantiers=chantiers.map(c=>c.id===cid?{...c,avancement:avg}:c);
  toast('Avancement: '+avg+'%');
}

}

  document.querySelectorAll('#cat-wrap .chip').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on');addCat=c;

async function saveFlux(){
  const btn=document.getElementById('fsave');
  const inner=document.getElementById('fsave-inner');
  const msg=document.getElementById('fmsg');
  const cid=document.getElementById('fc')?.value;
  const mont=parseFloat(document.getElementById('fm').value.replace(/\s/g,'').replace(/,/g,'.')||0);
  const date=document.getElementById('fd')?.value;
  if(!cid||!chantiers.find(x=>x.id===cid)){msg.textContent='Sélectionnez un chantier';return;}
  if(!mont||isNaN(mont)||mont<=0){msg.textContent='Montant invalide';return;}
  if(!date){msg.textContent='Date obligatoire';return;}
  msg.textContent='';btn.disabled=true;
  if(inner)inner.innerHTML='<div class="spin" style="width:14px;height:14px;border-width:2px"></div> Enregistrement…';
  const data={sens:addSens,cat:addCat,montant:mont,
    libelle:document.getElementById('fl')?.value.trim()||addCat,
    date,fournisseur:document.getElementById('ff')?.value||'',
    avancePerso:document.getElementById('fa')?.checked||false,
    cmt:document.getElementById('fcmt')?.value.trim()||'',
    createdAt:new Date().toISOString()};
  try{
    await FP(cid).add(data);
    if(data.avancePerso){const c=chantiers.find(x=>x.id===cid);await CP(cid).update({avancePerso:(c?.avancePerso||0)+mont});}
    if(data.sens==='entree'){
      const c=chantiers.find(x=>x.id===cid);
      const newReliquat=Math.max(0,(c?.reliquat||0)-mont);
      await CP(cid).update({reliquat:newReliquat});
    }
    toast('Enregistré ✓');renderAdd();
  }catch(e){
    msg.textContent='Erreur: '+e.message.slice(0,60);
    btn.disabled=false;
    if(inner)inner.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg> Enregistrer';
  }
}

async function saveStk(){
  const cid=document.getElementById('sc')?.value;
  const art=document.getElementById('sa')?.value.trim();
  const qte=parseFloat(document.getElementById('sq')?.value||0);
  const msg=document.getElementById('smsg');
  if(!art||!qte){msg.textContent='Article et quantité obligatoires';return;}
  const unite=document.getElementById('su')?.value||'';
  const pu=parseFloat(document.getElementById('spu')?.value.replace(/\s/g,'')||0);
  const fourn=document.getElementById('sf')?.value.trim()||'';
  // Merge or create stock entry
  const ex=(await SP(cid).where('article','==',art).get());
  if(!ex.empty){await ex.docs[0].ref.update({entree:ex.docs[0].data().entree+qte,reste:ex.docs[0].data().reste+qte});}
  else{await SP(cid).add({article:art,entree:qte,reste:qte,unite,pu,fournisseur:fourn,createdAt:new Date().toISOString()});}
  if(pu>0){await FP(cid).add({sens:'sortie',cat:'materiaux',montant:qte*pu,libelle:art+' × '+qte+' '+unite,fournisseur:fourn,date:today(),avancePerso:false,createdAt:new Date().toISOString()});}
  toast('Stock mis à jour ✓');renderAdd();
}

        </div>`;
      }).join('')}
    </div>
    <button class="btn-p" style="margin-top:14px" onclick="valPoints()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>
      Valider la présence
    </button>`;
}

function togP(id,nom,taux){
  const btn=document.getElementById('pb-'+id);
  if(!presences[id]){presences[id]={nom,taux,ok:true};btn.textContent='✓';btn.className='pb ok';}
  else if(presences[id].ok){presences[id].ok=false;btn.textContent='✕';btn.className='pb ko';}
  else{delete presences[id];btn.textContent='—';btn.className='pb';}
}

async function valPoints(){
  const cid=document.getElementById('pc')?.value;
  if(!cid){toast('Sélectionnez un chantier');return;}
  const ps=Object.entries(presences).filter(([,v])=>v.ok);
  if(!ps.length){toast('Aucune présence cochée');return;}
  const total=ps.reduce((s,[,v])=>s+v.taux,0);
  for(const[id,{nom,taux}]of ps){
    await FP(cid).add({sens:'sortie',cat:'mo',montant:taux,libelle:'Journée '+nom,date:today(),avancePerso:false,createdAt:new Date().toISOString()});
  }
  const c=chantiers.find(x=>x.id===cid);
  await CP(cid).update({paieAttente:(c?.paieAttente||0)+total});
  toast(ps.length+' présence(s) · '+fmt(total)+' F');
  Object.keys(presences).forEach(k=>delete presences[k]);
  renderOuvriers();
}

// ── PDF RAPPORT ───────────────────────────
async function exportPDF(cid){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const c=chantiers.find(x=>x.id===cid);if(!c)return;
  const W=210,M=15,DARK=[10,22,40],GREEN=[0,214,143],GR=[120,140,160];

  doc.setFillColor(...DARK);doc.rect(0,0,W,48,'F');
  doc.setFillColor(...GREEN);doc.rect(0,45,W,3,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(24);doc.setTextColor(...GREEN);
  doc.text('WERAL',M,22);
  doc.setFontSize(10);doc.setTextColor(255,255,255);doc.text('RAPPORT DE CHANTIER',M,30);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...GR);
  doc.text('Généré le '+new Date().toLocaleDateString('fr-FR'),M,38);

  let y=58;
  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(...DARK);doc.text(c.nom,M,y);y+=7;
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...GR);
  doc.text('Client: '+(c.client||'—')+'   Localisation: '+(c.localisation||'—'),M,y);y+=5;
  doc.text('Type: '+(c.type==='devis'?'Sur devis':'Forfait')+'   Démarrage: '+(c.dateDebut||'—'),M,y);y+=10;

  const pct=c.avancement||0;
  doc.setFillColor(230,235,245);doc.rect(M,y,W-2*M,5,'F');
  doc.setFillColor(...GREEN);doc.rect(M,y,(W-2*M)*pct/100,5,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...DARK);
  doc.text('Avancement: '+pct+'%',M,y+9);y+=16;

  try{
    const s=await FP(cid).orderBy('createdAt','desc').get();
    const flux=s.docs.map(d=>d.data());
    const tin=flux.filter(f=>f.sens==='entree').reduce((s,f)=>s+(f.montant||0),0);
    const tout=flux.filter(f=>f.sens==='sortie').reduce((s,f)=>s+(f.montant||0),0);
    doc.setFillColor(240,244,248);doc.rect(M,y,W-2*M,24,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...DARK);doc.text('SYNTHÈSE FINANCIÈRE',M+3,y+7);
    doc.setFont('helvetica','normal');doc.setFontSize(8);
    doc.setTextColor(0,160,100);doc.text('Entrées: '+tin.toLocaleString('fr-FR')+' FCFA',M+3,y+13);
    doc.setTextColor(200,60,80);doc.text('Sorties: '+tout.toLocaleString('fr-FR')+' FCFA',M+55,y+13);
    const sol=tin-tout;doc.setTextColor(...DARK);doc.text('Solde: '+sol.toLocaleString('fr-FR')+' FCFA',M+110,y+13);
    if(c.budget)doc.text('Budget: '+c.budget.toLocaleString('fr-FR')+' FCFA',M+3,y+19);
    if(c.reliquat)doc.text('Reliquat client: '+c.reliquat.toLocaleString('fr-FR')+' FCFA',M+55,y+19);
    y+=30;
    if(flux.length){
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...DARK);doc.text('DÉTAIL DES FLUX',M,y);y+=5;
      doc.setFillColor(...DARK);doc.rect(M,y,W-2*M,7,'F');
      doc.setFont('helvetica','normal');doc.setTextColor(255,255,255);doc.setFontSize(7.5);
      doc.text('Date',M+2,y+5);doc.text('Libellé',M+22,y+5);doc.text('Catégorie',M+100,y+5);doc.text('Montant',M+138,y+5);y+=9;
      flux.slice(0,25).forEach((f,i)=>{
        if(y>275){doc.addPage();y=20;}
        if(i%2===0){doc.setFillColor(245,248,252);doc.rect(M,y-1,W-2*M,7,'F');}
        doc.setTextColor(f.sens==='entree'?[0,140,90]:[180,40,60]);doc.setFontSize(7.5);
        doc.text((f.date||'').slice(0,10),M+2,y+4);
        doc.text((f.libelle||'').slice(0,38),M+22,y+4);
        doc.text((f.cat||'').slice(0,14),M+100,y+4);
        doc.text((f.sens==='entree'?'+':'-')+(f.montant||0).toLocaleString('fr-FR')+' F',M+138,y+4);
        y+=7;
      });
    }
  }catch(e){}
  doc.save('Rapport_'+c.nom.replace(/\s/g,'_')+'.pdf');
  toast('Rapport PDF téléchargé ✓');
}

function fmt(n){return Math.round(n||0).toLocaleString('fr-FR');}
function today(){return new Date().toISOString().split('T')[0];}
function fmtAmt(el){const r=el.value.replace(/[^0-9]/g,'');el.value=r?parseInt(r).toLocaleString('fr-FR'):'';}
function loading(){return '<div style="text-align:center;padding:30px;color:var(--text3)"><div class="spin" style="margin:0 auto 12px"></div>Chargement…</div>';}
function err(){return '<div class="empty"><p>Erreur de chargement</p></div>';}
function mkModal(html){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal">${html}</div>`;bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});return bg;}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(ttt);ttt=setTimeout(()=>el.classList.remove('on'),2800);}
function toggleTheme(){document.documentElement.classList.toggle('light');const l=document.documentElement.classList.contains('light');localStorage.setItem('weral-theme',l?'light':'dark');document.getElementById('theme-btn').innerHTML=l?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';}
if(localStorage.getItem('weral-theme')==='light')document.documentElement.classList.add('light');
</script>
